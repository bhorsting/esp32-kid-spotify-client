; Spotify Connect sink — uses the cspot ESP-IDF target
; Hardware control (LED, volume, reset) lives in src/ and is merged over time.
; Build this env from WIFI-Radio-ESP32-V2/components/cspot/targets/esp32

[platformio]
src_dir = main

[env:esp32-s3-spotify-sink]
platform = espressif32
board = esp32-s3-devkitc-1
framework = espidf
board_build.partitions = partitions.csv
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_upload.flash_size = 16MB
build_flags =
	-DCONFIG_IDF_TARGET_ESP32S3
	-DCONFIG_SPIRAM=y
monitor_speed = 115200
